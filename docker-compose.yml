services:
  x3-business-card:
    build: .
    container_name: x3-business-card
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - ORIGIN=https://eink-card.jrg.tools
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
